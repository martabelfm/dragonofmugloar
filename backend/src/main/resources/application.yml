spring:
  application:
    name: dragon-trainer-api
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

mugloar:
  base-url: ${MUGLOAR_BASE_URL:https://dragonsofmugloar.com}
  connect-timeout: 3s
  read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
