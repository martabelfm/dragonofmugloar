services:
  backend:
    build: ./backend
    environment:
      MUGLOAR_BASE_URL: https://dragonsofmugloar.com
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
