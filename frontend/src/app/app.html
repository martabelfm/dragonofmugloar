<div class="page-shell">
  <app-game-header (newGame)="startGame()" />
  <main>
    @if (store.error(); as error) {
      <section class="alert" role="alert">
        <span>{{ error }}</span
        ><button [attr.aria-label]="'dismissError' | translate" (click)="store.dismissError()">x</button>
      </section>
    }
    @if (!store.player()) {
      <section class="welcome card">
        <div class="dragon-sigil" aria-hidden="true">M</div>
        <p class="eyebrow">{{ 'dragonAwaits' | translate }}</p>
        <h2>{{ 'welcomeTitle' | translate }}</h2>
        <p>{{ 'welcomeMessage' | translate }}</p>
        <button class="button primary" [disabled]="store.busy()" (click)="startGame()">
          {{ (store.busy() ? 'preparingDen' : 'startNewGame') | translate }}
        </button>
      </section>
    } @else {
      <div class="dashboard-layout">
        <app-action-rail />
        <div class="content-grid">
          <app-mission-board (playAgain)="startGame()" />
          <app-shop-panel />
        </div>
      </div>
      <app-mobile-nav />
      <app-mission-feedback />
    }
  </main>
  <footer><span>{{ 'footerProduct' | translate }}</span><span>{{ 'footerTagline' | translate }}</span></footer>
</div>
